name: Validate VSIX
run-name: Validate VSIX${{ inputs.request_id != '' && format(' ({0})', inputs.request_id) || '' }}

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional correlation ID for release automation
        type: string
      expected_source:
        description: Optional exact commit required by release automation
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: vsix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify change
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - id: scope
        run: node .github/scripts/ci-scope.cjs

  package:
    name: Build candidate
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source: ${{ steps.identity.outputs.source }}
      artifact: ${{ steps.identity.outputs.artifact }}
      sha256: ${{ steps.summary.outputs.sha256 }}
      artifact_url: ${{ steps.summary.outputs.artifact_url }}
      filename: ${{ steps.summary.outputs.filename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify requested source
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
        run: |
          if [[ -n "$EXPECTED_SOURCE" ]]; then
            [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Check workflow syntax and security
        run: npm run check:workflows
      - run: npm ci
      - run: npm run lint
      - name: Check documentation links and public text
        run: node scripts/check-docs.cjs
      - name: Audit runtime and build dependencies
        run: npm audit
      - name: Package the clean source revision once
        run: npm run package -- --release
      - name: Unit and package checks for documentation changes
        if: needs.scope.outputs.mode == 'docs'
        run: |
          candidate=$(find "$PWD/dist" -maxdepth 1 -name '*.vsix' -print)
          EXPORT_VSIX_PATH="$candidate" npm run test:unit
      - name: Identify immutable candidate
        id: identity
        run: |
          source=$(git rev-parse HEAD)
          printf 'source=%s\nartifact=vsix-candidate-%s-%s\n' "$source" "$source" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          (cd dist && shasum -a 256 --check ./*.vsix.sha256)
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Describe the development download
        id: summary
        env:
          CANDIDATE_URL: ${{ steps.upload.outputs.artifact-url }}
          VALIDATION_MODE: ${{ needs.scope.outputs.mode }}
        run: node scripts/ci-vsix-summary.cjs

  validate:
    name: Validate (${{ matrix.label }})
    needs: [scope, package]
    if: needs.scope.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: ubuntu, os: ubuntu-24.04, code: latest}
          - {label: macos, os: macos-15, code: latest}
          - {label: windows, os: windows-2025, code: latest}
          - {label: vscode-minimum, os: ubuntu-24.04, code: '1.85.0'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CI: '1'
      PYTHONUTF8: '1'
      EXPORT_REAL_TOOLS: '1'
      VALIDATION_CODE_VERSION: ${{ matrix.code }}
    steps:
      - name: Select the platform temporary directory
        env:
          VALIDATION_TMPDIR: ${{ runner.os == 'Windows' && runner.temp || '/tmp' }}
        run: printf 'TMPDIR=%s\n' "$VALIDATION_TMPDIR" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: dist
      - name: Verify downloaded candidate
        env:
          VALIDATION_SOURCE: ${{ needs.package.outputs.source }}
        run: node .github/scripts/verify-candidate.cjs
      - name: Compile checkout for archive parity checks
        run: npm run compile
      - name: Provision actual export engines and isolated VS Code
        if: runner.os != 'Windows'
        run: bash .github/scripts/provision-validation.sh
      - name: Provision Windows export engines and isolated VS Code
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/provision-validation.ps1
      - name: Frozen source contract
        run: node -e "require('node:child_process').execFileSync(process.env.VALIDATION_PYTHON, ['test/fixtures/exports/verify-fixtures.py'], {stdio:'inherit'})"
      - name: Units, real converters and archive parity
        if: runner.os != 'Windows'
        run: |
          mkdir -p ci-results
          npm run test:unit | tee ci-results/unit-tests.txt
      # Git Bash enables backup/restore privileges for administrator tokens,
      # allowing its children to bypass the denied-directory test's ACL.
      - name: Units, real converters and archive parity (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-results | Out-Null
          npm.cmd run test:unit | Tee-Object -FilePath ci-results/unit-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installed VSIX user flows and artifact integrity
        if: runner.os != 'Windows'
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' node .github/scripts/native-check.cjs | tee ci-results/native-tests.txt
          else
            node .github/scripts/native-check.cjs | tee ci-results/native-tests.txt
          fi
      - name: Installed VSIX user flows and artifact integrity (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node .github/scripts/native-check.cjs | Tee-Object -FilePath ci-results/native-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ matrix.label }}-${{ needs.package.outputs.source }}-${{ github.run_attempt }}
          path: ci-results
          if-no-files-found: warn
          retention-days: 7

  browser:
    name: Browser (${{ matrix.platform.label }}, ${{ matrix.shard }}/3)
    needs: [scope, package]
    if: needs.scope.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {label: ubuntu, os: ubuntu-24.04}
          - {label: macos, os: macos-15}
          - {label: windows, os: windows-2025}
        shard: [1, 2, 3]
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 20
    env:
      CI: '1'
      CI_BROWSER_PLATFORM: ${{ matrix.platform.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Compile and build browser fixture
        run: npm run compile && npm run test:build
      - name: Provision browser only
        run: node .github/scripts/provision-browser.cjs
      - name: Browser regressions with no retries
        if: runner.os != 'Windows'
        run: |
          mkdir -p ci-results
          npx playwright test --workers=2 --retries=0 --shard=${{ matrix.shard }}/3 --reporter=list,blob | tee ci-results/browser-tests.txt
      - name: Browser regressions with no retries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-results | Out-Null
          npx.cmd playwright test --workers=2 --retries=0 --shard=${{ matrix.shard }}/3 --reporter=list,blob | Tee-Object -FilePath ci-results/browser-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-${{ matrix.platform.label }}-${{ matrix.shard }}-${{ needs.package.outputs.source }}-${{ github.run_attempt }}
          path: |
            ci-results
            blob-report
            test-results
          if-no-files-found: error
          retention-days: 7

  ready:
    # A skipped job still creates a successful check. Branch builds must never
    # create a check with the protected PR/main gate's name.
    name: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && 'Branch build only' || 'VSIX validation' }}
    needs: [scope, package, validate, browser]
    if: always() && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Require every applicable validation lane
        env:
          VALIDATION_MODE: ${{ needs.scope.outputs.mode }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          NATIVE_RESULT: ${{ needs.validate.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          CANDIDATE: ${{ needs.package.outputs.artifact }}
          PACKAGE_FILE: ${{ needs.package.outputs.filename }}
          SOURCE: ${{ needs.package.outputs.source }}
          ARTIFACT_URL: ${{ needs.package.outputs.artifact_url }}
          SHA256: ${{ needs.package.outputs.sha256 }}
        run: node .github/scripts/ci-gate.cjs
